name: Check Spark7162 Sources

'on':
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Check Taapat repository
        run: git ls-remote --heads https://github.com/Taapat/vuplus-fulan-openpli-oe-core.git

      - name: Download Taapat sources
        run: git clone --depth 1 https://github.com/Taapat/vuplus-fulan-openpli-oe-core.git fulan

      - name: Search Spark7162 configuration
        run: grep -Rni "spark7162" fulan --include="*.conf" --include="*.bb" || true

      - name: Show machine configurations
        run: find fulan -iname "*spark*" -o -iname "*fulan*"
