name: Check Historical OpenPLi

'on':
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Download historical OpenPLi revision
        run: |
          git init core
          cd core
          git remote add origin https://github.com/OpenPLi/openpli-oe-core.git
          git fetch --depth=1 origin ab347d9
          git checkout FETCH_HEAD
          git log -1 --oneline

      - name: Check historical machine configuration
        run: |
          find core -iname "*spark7162*" -o -iname "*fulan*"

      - name: Check Taapat sources
        run: |
          git clone --depth 1 https://github.com/Taapat/vuplus-fulan-openpli-oe-core.git fulan
          cat fulan/Makefile
          cat fulan/meta-fulan/conf/machine/spark7162.conf

      - name: Search image recipe
        run: |
          grep -Rni "openpli-enigma2-image" core fulan --include="*.bb" --include="Makefile" || true
