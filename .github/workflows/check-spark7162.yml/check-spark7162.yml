name: Check Spark7162 Sources

on:
workflow_dispatch:

jobs:
check:
runs-on: ubuntu-22.04
steps:
- name: Check historical OpenPLi branches
run: |
echo "=== OpenPLi branches ==="
git ls-remote --heads https://github.com/OpenPLi/openpli-oe-core.git

      echo "=== pli-extras branches ==="
      git ls-remote --heads https://github.com/PLi-metas/pli-extras.git

  - name: Check Spark7162 support
    run: |
      git clone --depth 1 -b develop https://github.com/OpenPLi/openpli-oe-core.git core || true
      git clone --depth 1 -b develop https://github.com/PLi-metas/pli-extras.git extras || true
      echo "=== Spark7162 references ==="
      grep -Rni "spark7162" extras core --include="*.conf" --include="*.bb" || true
